[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lacd"
version = "0.1.0"
description = "Logical assembly error detection beyond surface defects (MVTec LOCO AD)"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2", "torchvision>=0.17", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.3",
  "pillow>=10", "pyyaml>=6", "pydantic>=2.5", "matplotlib>=3.8", "opencv-python-headless>=4.8",
]
[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
